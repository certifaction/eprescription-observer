name: Continuous Integration
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            file_name: certifaction
            artifact_name: certifaction
          - os: darwin
            arch: arm64
            file_name: certifaction
            artifact_name: certifaction
          - os: windows
            arch: amd64
            file_name: certifaction.exe
            artifact_name: certifaction
          - os: windows
            arch: arm64
            file_name: certifaction.exe
            artifact_name: certifaction
          - os: linux
            arch: amd64
            file_name: certifaction
            artifact_name: certifaction
          - os: linux
            arch: arm64
            file_name: certifaction
            artifact_name: certifaction
          - os: freebsd
            arch: amd64
            file_name: certifaction
            artifact_name: certifaction
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: 1.26

      - name: Run Build
        run: make build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.file_name }}
          retention-days: 7

  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9